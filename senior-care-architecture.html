<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시니어 안심 케어 - 아키텍처</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        
        .slide {
            width: 100%;
            max-width: 1200px;
            height: 675px;
            margin: 20px auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        
        .slide::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s linear infinite;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .content {
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 24px;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .architecture {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            margin: 30px 0;
            align-items: center;
        }
        
        .layer {
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(10px);
        }
        
        .layer-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            opacity: 0.9;
        }
        
        .layer-item {
            font-size: 12px;
            margin: 4px 0;
            padding: 4px 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        
        .center-layer {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .center-box {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
        }
        
        .arrow {
            text-align: center;
            font-size: 24px;
            opacity: 0.8;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        
        .feature {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            backdrop-filter: blur(10px);
        }
        
        .feature-icon {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            opacity: 0.8;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 15px;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        @media print {
            body {
                background: white;
            }
            .slide {
                margin: 0;
                border-radius: 0;
                box-shadow: none;
                page-break-after: always;
            }
            .controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="downloadPDF()">📥 PDF 다운로드</button>
        <button onclick="window.print()">🖨️ 인쇄</button>
    </div>
    
    <div id="slide" class="slide">
        <div class="content">
            <div class="header">
                <div class="title">🏥 시니어 안심 케어</div>
                <div class="subtitle">독거 노인 안전 모니터링 시스템</div>
            </div>
            
            <div class="architecture">
                <!-- 좌측: 데이터 소스 -->
                <div>
                    <div class="layer">
                        <div class="layer-title">📱 데이터 소스</div>
                        <div class="layer-item">📞 휴대폰 센서</div>
                        <div class="layer-item">🏠 IoT 기기</div>
                        <div class="layer-item">🎤 AI 스피커</div>
                    </div>
                </div>
                
                <!-- 중앙: AWS 클라우드 -->
                <div class="center-layer">
                    <div class="arrow">⬇️</div>
                    <div class="center-box">API Gateway</div>
                    <div class="center-box">Lambda<br>(데이터 처리)</div>
                    <div class="center-box">DynamoDB / RDS<br>(데이터 저장)</div>
                    <div class="center-box">SNS / SQS<br>(알림 전송)</div>
                    <div class="arrow">⬇️</div>
                </div>
                
                <!-- 우측: 출력 -->
                <div>
                    <div class="layer">
                        <div class="layer-title">📤 출력</div>
                        <div class="layer-item">📲 보호자 알림</div>
                        <div class="layer-item">📊 활동 리포트</div>
                        <div class="layer-item">📈 대시보드</div>
                    </div>
                </div>
            </div>
            
            <!-- 핵심 기능 -->
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🔍</div>
                    <div>활동 감지</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">⏰</div>
                    <div>부재 감지</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🎤</div>
                    <div>음성 확인</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🚨</div>
                    <div>긴급 알림</div>
                </div>
            </div>
            
            <!-- 하단 정보 -->
            <div class="footer">
                <div>
                    <strong>핵심 가치:</strong> 99.5% 가용성 | 3초 알림 | 10,000명 동시 지원
                </div>
                <div>
                    2026년 3월
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function downloadPDF() {
            const element = document.getElementById('slide');
            const opt = {
                margin: 0,
                filename: 'senior-care-architecture.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { format: 'a4', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
